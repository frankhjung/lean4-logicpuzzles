name = "LogicPuzzles"
version = "0.1.0"
defaultTargets = ["BreakfastTime", "Test"]
lintDriver = "batteries/runLinter"

[[lean_lib]]
name = "BreakfastTime"
globs = ["BreakfastTime", "BreakfastTime.+"]

[[lean_exe]]
name = "BreakfastTimeExe"
root = "BreakfastTime.Main"

[[lean_lib]]
name = "Test"
globs = ["Test", "Test.+"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.32.0"

[[require]]
name = "Mathlib"
scope = "leanprover-community"
rev = "v4.32.0"
